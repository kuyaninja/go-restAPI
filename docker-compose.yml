services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: skeleton-app
    restart: unless-stopped
    environment:
      APP_ENV: docker
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
      - ./resources:/app/resources
    depends_on:
      - mysql
      #- redis
  mysql:
    image: mysql:8.0
    container_name: skeleton-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: skeleton_local
      MYSQL_USER: skeleton
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: skeleton-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mysql_data:
