app:
  name: "Skeleton API (local)"
  versions:
    - "v1"
    - "v2"
  secret: "local-secret"
  locale: "id"
http:
  port: "8080"
database:
  host: "localhost"
  port: 3306
  user: "skeleton"
  password: "secret"
  name: "skeleton_local"
  sslmode: "disable"
  log_queries: true
logging:
  file: "logs/app.log"
  max_size_mb: 10
  max_backups: 5
  max_age_days: 30
  compress: true
external:
  jsonplaceholder_url: "https://jsonplaceholder.typicode.com"
auth:
  access_token_ttl_minutes: 60
  refresh_token_ttl_minutes: 4320
redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
